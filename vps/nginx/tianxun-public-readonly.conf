# Legacy filename retained for deployment compatibility. This site is no longer
# anonymous: browser/API access is authenticated by Tianxun's server-side session.
# Production login deliberately refuses plain HTTP. Obtain a certificate and let
# Certbot (or an equivalent TLS terminator) redirect port 80 to HTTPS.

limit_req_zone $binary_remote_addr zone=tianxun_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=tianxun_api:10m rate=8r/s;
limit_req_zone $binary_remote_addr zone=tianxun_web:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=tianxun_conn:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 320k;
    limit_conn tianxun_conn 20;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location = /api/health/live {
        limit_req zone=tianxun_api burst=3 nodelay;
        include /etc/nginx/snippets/tianxun-proxy-common.conf;
        proxy_pass http://127.0.0.1:3000;
    }

    location = /api/auth/login {
        client_max_body_size 8k;
        limit_req zone=tianxun_login burst=2 nodelay;
        include /etc/nginx/snippets/tianxun-proxy-common.conf;
        proxy_pass http://127.0.0.1:3000;
    }

    location ~ ^/api/auth/(?:logout|session)$ {
        limit_req zone=tianxun_api burst=4 nodelay;
        include /etc/nginx/snippets/tianxun-proxy-common.conf;
        proxy_pass http://127.0.0.1:3000;
    }

    location ~ ^/api/planning/(?:schedule|scenarios)$ {
        client_max_body_size 512k;
        limit_req zone=tianxun_api burst=4 nodelay;
        include /etc/nginx/snippets/tianxun-proxy-common.conf;
        proxy_pass http://127.0.0.1:3000;
    }

    # Do not inject X-Tianxun-Proxy-Secret or a synthetic role here. The
    # application validates the HttpOnly session cookie for every protected API.
    location /api/ {
        limit_req zone=tianxun_api burst=12 nodelay;
        include /etc/nginx/snippets/tianxun-proxy-common.conf;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        limit_req zone=tianxun_web burst=60 nodelay;
        include /etc/nginx/snippets/tianxun-proxy-common.conf;
        proxy_pass http://127.0.0.1:3000;
    }
}
