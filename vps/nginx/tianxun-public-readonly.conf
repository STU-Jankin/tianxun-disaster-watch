limit_req_zone $binary_remote_addr zone=tianxun_public_api:10m rate=6r/s;
limit_req_zone $binary_remote_addr zone=tianxun_public_web:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=tianxun_public_conn:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 64k;
    limit_conn tianxun_public_conn 20;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/events {
        limit_req zone=tianxun_public_api burst=6 nodelay;
        include /etc/nginx/snippets/tianxun-proxy-secret.conf;
        include /etc/nginx/snippets/tianxun-proxy-common.conf;
        proxy_pass http://127.0.0.1:3000;
    }

    location = /api/location {
        limit_req zone=tianxun_public_api burst=10 nodelay;
        include /etc/nginx/snippets/tianxun-proxy-secret.conf;
        include /etc/nginx/snippets/tianxun-proxy-common.conf;
        proxy_pass http://127.0.0.1:3000;
    }

    location = /api/weather {
        limit_req zone=tianxun_public_api burst=10 nodelay;
        include /etc/nginx/snippets/tianxun-proxy-secret.conf;
        include /etc/nginx/snippets/tianxun-proxy-common.conf;
        proxy_pass http://127.0.0.1:3000;
    }

    location = /api/health {
        limit_req zone=tianxun_public_api burst=3 nodelay;
        include /etc/nginx/snippets/tianxun-proxy-secret.conf;
        include /etc/nginx/snippets/tianxun-proxy-common.conf;
        proxy_pass http://127.0.0.1:3000;
    }

    # The trial endpoint intentionally exposes no persisted satellite tasks and
    # rejects every mutation. Full task operations require HTTPS and user auth.
    location = /api/tasks {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        if ($request_method = GET) {
            return 200 '{"tasks":[],"cancelledTaskIds":[],"storage":"public-read-only"}';
        }
        return 403 '{"error":"公网试用入口为只读模式"}';
    }

    location ~ ^/api/(changes|visibility)(?:/|$) {
        default_type application/json;
        return 403 '{"error":"公网试用入口为只读模式"}';
    }

    location /api/ {
        default_type application/json;
        return 404 '{"error":"接口不存在"}';
    }

    location / {
        limit_req zone=tianxun_public_web burst=60 nodelay;
        include /etc/nginx/snippets/tianxun-proxy-common.conf;
        proxy_pass http://127.0.0.1:3000;
    }
}
