limit_req_zone $binary_remote_addr zone=tianxun_public_api:10m rate=6r/s;
limit_req_zone $binary_remote_addr zone=tianxun_public_web:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=tianxun_public_conn:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 64k;
    limit_conn tianxun_public_conn 20;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/events {
        limit_req zone=tianxun_public_api burst=6 nodelay;
        include /etc/nginx/snippets/tianxun-proxy-secret.conf;
        include /etc/nginx/snippets/tianxun-proxy-common.conf;
        proxy_pass http://127.0.0.1:3000;
    }

    location = /api/location {
        limit_req zone=tianxun_public_api burst=10 nodelay;
        include /etc/nginx/snippets/tianxun-proxy-secret.conf;
        include /etc/nginx/snippets/tianxun-proxy-common.conf;
        proxy_pass http://127.0.0.1:3000;
    }

    location = /api/weather {
        limit_req zone=tianxun_public_api burst=10 nodelay;
        include /etc/nginx/snippets/tianxun-proxy-secret.conf;
        include /etc/nginx/snippets/tianxun-proxy-common.conf;
        proxy_pass http://127.0.0.1:3000;
    }

    location = /api/health {
        limit_req zone=tianxun_public_api burst=3 nodelay;
        include /etc/nginx/snippets/tianxun-proxy-secret.conf;
        include /etc/nginx/snippets/tianxun-proxy-common.conf;
        proxy_pass http://127.0.0.1:3000;
    }

    location = /api/satellites {
        limit_except GET { deny all; }
        limit_req zone=tianxun_public_api burst=3 nodelay;
        include /etc/nginx/snippets/tianxun-proxy-secret.conf;
        include /etc/nginx/snippets/tianxun-proxy-common.conf;
        proxy_pass http://127.0.0.1:3000;
    }

    # Bounded anonymous mission-planning trial. Nginx assigns an operator
    # identity from the network address and overwrites every client-supplied
    # identity header, so task ownership remains isolated between addresses.
    location = /api/tasks {
        limit_except GET POST DELETE { deny all; }
        client_max_body_size 256k;
        limit_req zone=tianxun_public_api burst=4 nodelay;
        include /etc/nginx/snippets/tianxun-proxy-secret.conf;
        include /etc/nginx/snippets/tianxun-proxy-common.conf;
        proxy_set_header X-Tianxun-User "public-$remote_addr";
        proxy_set_header X-Tianxun-Role "operator";
        proxy_pass http://127.0.0.1:3000;
    }

    location = /api/tasks/export {
        limit_except POST { deny all; }
        client_max_body_size 256k;
        limit_req zone=tianxun_public_api burst=2 nodelay;
        include /etc/nginx/snippets/tianxun-proxy-secret.conf;
        include /etc/nginx/snippets/tianxun-proxy-common.conf;
        proxy_set_header X-Tianxun-User "public-$remote_addr";
        proxy_set_header X-Tianxun-Role "operator";
        proxy_pass http://127.0.0.1:3000;
    }

    location = /api/visibility {
        limit_except POST { deny all; }
        client_max_body_size 128k;
        limit_req zone=tianxun_public_api burst=2 nodelay;
        include /etc/nginx/snippets/tianxun-proxy-secret.conf;
        include /etc/nginx/snippets/tianxun-proxy-common.conf;
        proxy_set_header X-Tianxun-User "public-$remote_addr";
        proxy_set_header X-Tianxun-Role "operator";
        proxy_read_timeout 90s;
        proxy_pass http://127.0.0.1:3000;
    }

    # Field road/bridge reports may contain sensitive or unverified operational
    # information. The public trial receives an explicit empty registry instead
    # of being allowed to read or mutate the internal review queue.
    location = /api/road-disruptions {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        if ($request_method = GET) {
            return 200 '{"disruptions":[],"storage":"public-read-only","policy":"internal verified registry is not exposed on the public trial"}';
        }
        return 403 '{"error":"公网试用入口不开放道路中断上报与核验"}';
    }

    # Routing and Overpass screening may consume paid/limited upstream quota and
    # expose operational coordinates. They stay behind the authenticated console.
    location ~ ^/api/(changes|routing|infrastructure|landslide-terrain)(?:/|$) {
        default_type application/json;
        return 403 '{"error":"公网试用入口为只读模式"}';
    }

    location /api/ {
        default_type application/json;
        return 404 '{"error":"接口不存在"}';
    }

    location / {
        limit_req zone=tianxun_public_web burst=60 nodelay;
        include /etc/nginx/snippets/tianxun-proxy-common.conf;
        proxy_pass http://127.0.0.1:3000;
    }
}
